<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WishOS</title><style>body{font:17px system-ui;max-width:640px;margin:32px auto;padding:16px}input,button{font:inherit;padding:10px;margin:6px}pre{white-space:pre-wrap}</style><h1>WishOS</h1><p>初始文件暂不可用。文件保存在 LittleFS；可准备存储器或通过 MCP 修复。<br>Startup files are unavailable. Mount the filesystem or repair files through MCP.</p><button onclick="call('/dev/flash','mount')">准备存储 / Mount</button><button onclick="if(confirm('清空内部文件？Erase internal files?'))call('/dev/flash','format')">初始化 / Format</button><p><input id="ssid" placeholder="Wi-Fi SSID"><input id="password" type="password" placeholder="密码 / Password"><button onclick="call('/dev/wifi','connect',{ssid:ssid.value,password:password.value,persist:true})">连接 / Connect</button><button onclick="call('/dev/wifi','read')">网络 / Network</button></p><button onclick="call('/sys/apps','home')">重试桌面 / Retry Home</button><pre id="output"></pre><script>async function call(path,method,args={}){try{const r=await fetch('/os/invoke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path,method,args})});output.textContent=JSON.stringify(await r.json(),null,2)}catch(e){output.textContent=e.message}}</script>
