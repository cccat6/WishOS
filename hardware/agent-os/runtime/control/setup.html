<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WishOS</title>
<style>*{box-sizing:border-box}body{font:16px system-ui;max-width:880px;margin:auto;padding:20px;background:#faf9f6;color:#20252b}h1{font-size:26px}nav{display:flex;gap:6px;overflow:auto;margin:20px 0}button,input,select,textarea{font:inherit;border:1px solid #ccd3ce;border-radius:8px;padding:10px;background:white}button{cursor:pointer}button:disabled{opacity:.5}nav .active,.primary{background:#286354;color:white}section{display:none;padding:20px;background:white;border:1px solid #e0e4df;border-radius:14px}section.active{display:block}label{display:block;margin:14px 0 6px}input:not([type=checkbox]),select,textarea{width:100%;margin:5px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}small{color:#68766d}#notice{min-height:26px;margin:16px 0}table{width:100%;border-collapse:collapse}td{border-bottom:1px solid #eee;padding:8px}canvas{display:block;max-width:100%;max-height:60vh;margin:16px auto;border:1px solid #ddd}a{color:#286354}.row{display:flex;gap:8px}.row>*{flex:1}</style>
<h1>WishOS</h1><nav><button data-tab="applications" class="active">应用桌面</button><button data-tab="image">手机传图</button><button data-tab="network">网络配置</button><button data-tab="files">文件管理</button><button data-tab="system">系统设置</button></nav>
<section id="applications" class="active"><button id="refreshApps">刷新应用</button><button id="goHome">返回桌面</button><button id="openVoice">语音对话</button><div id="appList"></div><label>应用描述文件<input id="manifestPath" placeholder="/storage/user/apps/reader/app.json"></label><button id="installApp">安装引用</button><details><summary>连接上位服务</summary><label>服务地址<input id="server" placeholder="wss://server/os/device?id=my-device"></label><label>令牌<input id="token" placeholder="可留空"></label><details><summary>TLS 验证</summary><label><input type="checkbox" id="verify"> 验证服务器证书</label><label>受信任 CA（PEM）<textarea id="ca" rows="4"></textarea></label></details><button class="primary" id="saveLink">保存服务地址</button><pre id="linkState"></pre></details></section>
<section id="image"><label>图片<input type="file" id="picture" accept="image/*"></label><div class="row"><label>画面适配<select id="fit"><option value="cover">裁切铺满</option><option value="contain">完整显示</option></select></label><label>颜色<select id="color"><option value="nearest">最近色</option><option value="diffuse">误差扩散混色</option></select></label></div><label>显示配置<select id="displayProfile"></select></label><canvas id="preview" hidden></canvas><button id="showImage" class="primary" disabled>显示图片</button><small id="imageHint"></small><button id="backView">返回上一页</button></section>
<section id="network"><pre id="networkInfo"></pre><button id="refreshNetwork">刷新</button><button id="scan">扫描 Wi-Fi</button><select id="networks"><option value="">选择附近网络</option></select><label>SSID<input id="ssid" autocomplete="off"></label><label>密码<input id="password" type="password"></label><button id="connectWifi" class="primary">连接</button><button id="offline">开启传图热点</button><button id="autoWifi">恢复自动连接</button><p id="networkResult"></p><details><summary>已保存的网络</summary><div id="profiles"></div></details></section>
<section id="files"><label>存储器<select id="volumes"></select></label><button id="mount">准备存储器</button><pre id="storageInfo"></pre><label>目录<input id="dir" value="/storage/ram"></label><div class="row"><button id="list">打开目录</button><button id="parent">上一级</button><button id="mkdir">新建目录</button></div><label>上传文件<input type="file" id="upload"></label><button id="uploadFile">上传</button><table id="entries"></table><button id="more">下一页</button></section>
<section id="system"><button id="refreshSystem">刷新状态</button><pre id="systemInfo"></pre><label>运行时入口<input id="app" placeholder="/storage/user/app/startup.lua"></label><button id="loadApp">加载应用</button><small>临时运行脚本。长期使用请在应用桌面安装应用描述文件。</small><label>系统调用<textarea id="command" rows="6">{"path":"/sys/capabilities","method":"list","args":{"cursor":0,"limit":4,"details":false}}</textarea></label><button id="invoke">执行</button><details><summary>应用服务配置</summary><label>名称<input id="profileName" value="agent"></label><label>配置 JSON<textarea id="profileJson" rows="5">{"url":"","token":""}</textarea></label><button id="saveProfile">保存</button></details></section>
<div id="notice" role="status"></div><pre id="output"></pre>
<script src="/control/control.js"></script><script src="/control/display.js"></script></html>
