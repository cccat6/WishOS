<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic Notes</title><style>*{box-sizing:border-box}body{font:16px system-ui;margin:auto;max-width:900px;padding:24px;background:#faf9f6;color:#20252b}h1{font-size:28px}nav{display:flex;gap:8px;margin:20px 0}button,input,select,textarea{font:inherit;border:1px solid #cdd2d4;border-radius:9px;padding:10px;background:white}button{cursor:pointer}nav button.active,button.primary{background:#286354;color:white}section{display:none;background:white;border:1px solid #e1e2dd;padding:20px;border-radius:14px}section.active{display:block}label{display:block;margin:12px 0}input,textarea{width:100%;margin:6px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:#f3f4f0;padding:12px;border-radius:8px}table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid #eee}small{color:#65716c}#message{min-height:24px;margin-top:18px}</style><h1>Agentic Notes</h1><nav><button class="active" data-tab="runtime">系统状态</button><button data-tab="files">文件管理</button><button data-tab="settings">配置</button></nav><section id="runtime" class="active"><button onclick="status()">刷新状态</button><button onclick="invoke('/dev/display','drivers').then(show)">显示驱动</button><button onclick="invoke('/sys/ui','refresh').then(show).catch(fail)">刷新当前页面</button><pre id="state"></pre><label>UI 文件路径<input id="uipath" value="/system/ui/home.json"></label><button onclick="invoke('/sys/ui','open',{path:uiPath()}).then(show).catch(fail)">打开页面</button><button onclick="invoke('/sys/ui','back').then(show).catch(fail)">返回</button><hr><button onclick="invoke('/dev/mic','start').then(show).catch(fail)">开始录音</button><button onclick="invoke('/dev/mic','stop').then(show).catch(fail)">停止录音</button><button onclick="invoke('/dev/mic','read').then(show)">录音状态</button></section><section id="files"><button onclick="invoke('/sys/storage','read').then(show)">存储空间</button><button onclick="invoke('/dev/sd','mount').then(()=>list()).catch(fail)">挂载 SD</button><label>目录<input id="dir" value="/storage/user"></label><button onclick="list()">打开目录</button><input type="file" id="upload"><button onclick="uploadFile()">上传文件</button><table id="entries"></table><button id="more" onclick="list(nextCursor)">下一页</button></section><section id="settings"><label>Wi-Fi SSID<input id="ssid" autocomplete="off"></label><label>Wi-Fi 密码<input id="password" type="password"></label><button class="primary" onclick="connect()">连接</button><button onclick="invoke('/net/default','read').then(show)">网络信息</button><hr><label>服务类型<select id="role"><option value="mcp">MCP</option><option value="agent">上位 Agent</option><option value="llm">LLM API</option></select></label><label>服务地址<input id="endpoint"></label><label>令牌（可留空）<input id="endpointToken"></label><label>模型（可留空）<input id="model"></label><button onclick="saveEndpoint()">保存连接配置</button><button onclick="invoke('/sys/connections','read').then(show)">读取连接配置</button><hr><button onclick="loadConfig()">读取系统策略</button><button onclick="invoke('/sys/config','describe').then(show)">支持的设置</button><label>配置事务<textarea id="config" rows="16">{"scope":"system","changes":[{"resource":"/dev/mic","settings":{"storage":"history"}}]}</textarea></label><label><input id="persist" type="checkbox" style="width:auto">保存配置</label><button onclick="applyConfig(true)">验证</button><button class="primary" onclick="applyConfig(false)">应用配置</button></section><div id="message"></div><pre id="result"></pre><script>
const $=id=>document.getElementById(id);let nextCursor=0;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});
async function invoke(path,method='read',args={}){const r=await fetch('/os/invoke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:crypto.randomUUID?.()||String(Date.now()),path,method,args})});const d=await r.json();if(!d.ok)throw Error(d.error);return d.result}
function show(v){$('result').textContent=JSON.stringify(v,null,2);$('message').textContent=''}function fail(e){$('message').textContent=e.message}function uiPath(){return $('uipath').value}
async function status(){try{$('state').textContent=JSON.stringify(await invoke('/sys/stats'),null,2)}catch(e){fail(e)}}
async function connect(){try{show(await invoke('/net/default','connect',{ssid:$('ssid').value,password:$('password').value,persist:true}))}catch(e){fail(e)}}
async function loadConfig(){try{const c=await invoke('/sys/config');$('config').value=JSON.stringify({scope:'system',expected_revision:c.revision,changes:Object.entries(c.effective).map(([resource,settings])=>({resource,settings}))},null,2);show(c)}catch(e){fail(e)}}
async function applyConfig(dry){try{const d=JSON.parse($('config').value);d.persist=$('persist').checked;show(await invoke('/sys/config',dry?'validate':'apply',d))}catch(e){fail(e)}}
async function list(cursor=0){try{const base=$('dir').value.replace(/\/$/,'');const d=await invoke('/fs','list',{file:base,cursor,limit:12});nextCursor=d.next_cursor;$('more').disabled=!d.more;$('entries').replaceChildren();for(const f of d.entries){const tr=document.createElement('tr');const name=document.createElement('td');const btn=document.createElement('button');btn.textContent=f.name;btn.onclick=()=>{if(f.directory){$('dir').value=base+'/'+f.name;list()}else download(base+'/'+f.name)};name.append(btn);const size=document.createElement('td');size.textContent=f.directory?'目录':f.size+' B';tr.append(name,size);$('entries').append(tr)}}catch(e){fail(e)}}
function toHex(b){return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('')}function fromHex(h){return Uint8Array.from(h.match(/../g)||[],s=>parseInt(s,16))}
async function uploadFile(){try{const f=$('upload').files[0];if(!f)return;const dest=$('dir').value.replace(/\/$/,'')+'/'+f.name;for(let at=0;at<f.size||at===0;at+=1024){const b=new Uint8Array(await f.slice(at,at+1024).arrayBuffer());await invoke('/fs','write',{file:dest,offset:String(at),truncate:at===0,hex:toHex(b)});$('message').textContent=`上传 ${Math.min(at+b.length,f.size)} / ${f.size}`;if(!f.size)break}await list();$('message').textContent='文件已保存'}catch(e){fail(e)}}
async function download(file){try{let at='0';const chunks=[];for(;;){const d=await invoke('/fs','read',{file,offset:at,length:1024});const b=fromHex(d.hex);if(!b.length)break;chunks.push(b);at=d.next_offset;$('message').textContent='下载 '+at+' B'}const url=URL.createObjectURL(new Blob(chunks));const a=document.createElement('a');a.href=url;a.download=file.split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);$('message').textContent='下载完成'}catch(e){fail(e)}}
status();
async function saveEndpoint(){try{const role=$('role').value;await invoke('/sys/connections','configure',{profiles:{[role]:{url:$('endpoint').value,token:$('endpointToken').value,model:$('model').value,enabled:true}},persist:true});$('message').textContent='配置已保存；连接由所选应用执行'}catch(e){fail(e)}}
</script></html>
