name: Device firmware
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      board:
        description: Board directory id, or all
        required: true
        default: all
        type: string
      release_version:
        description: Optional version to create a draft release after validation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: targets
        env:
          EVENT: ${{ github.event_name }}
          BOARD: ${{ inputs.board }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          version=os.environ.get('RELEASE_VERSION','')
          if version and not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,63}',version):
              raise SystemExit('Invalid release version')
          command=['python3','tools/agentic_os_catalog.py','--github-output',os.environ['GITHUB_OUTPUT']]
          if os.environ['EVENT']=='workflow_dispatch':command+=['--board',os.environ['BOARD']]
          elif os.environ.get('BASE') and set(os.environ['BASE'])!={'0'}:command+=['--base',os.environ['BASE']]
          subprocess.run(command,check=True)
          PY

  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build
      - run: |
          python3 -m venv build/host-env
          build/host-env/bin/pip install Pillow==12.3.0
          npm ci --prefix tools
      - run: python3 tools/prepare_arduino.py --host-libraries build/host-libraries
      - env:
          ARDUINO_LIBRARIES: ${{ github.workspace }}/build/host-libraries
          PYTHON: build/host-env/bin/python
          CXX: clang++
        run: tools/test_agentic_os.sh

  build:
    needs: plan
    if: needs.plan.outputs.has_targets == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: '1.5.1'
      - env:
          BOARD: ${{ matrix.board }}
        run: python3 tools/prepare_arduino.py --install-core --board "$BOARD"
      - env:
          NOTES_OS_BOARD: ${{ matrix.board }}
        run: tools/build_agentic_os.sh
      - env:
          BOARD: ${{ matrix.board }}
        run: python3 tools/release_agentic_os.py "build/agentic-os/$BOARD/firmware" --output "build/release/$BOARD.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.board }}
          path: build/release/*.zip
          if-no-files-found: error

  release:
    needs: [host, build]
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*
          path: firmware
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.release_version }}
          BOARD: ${{ inputs.board }}
          REVISION: ${{ github.sha }}
        run: |
          gh release create "firmware-$BOARD-$VERSION" firmware/*.zip --draft --target "$REVISION" --title "$BOARD $VERSION" --notes "Device-specific firmware. See each archive's build manifest and the repository's hardware validation status."
